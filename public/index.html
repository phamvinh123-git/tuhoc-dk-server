<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký Tự học</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --brand:#c8203f; --brand-dark:#a01732; --brand-light:#e94f6b; --brand-soft:#fdecef; --brand-ink:#ffffff; --line:#e8eaee;
    --ok:#16a34a; --ok-bg:#dcfce7; --warn:#d97706; --warn-bg:#fef3c7;
    --full:#dc2626; --full-bg:#fee2e2; --locked-bg:#f1f2f5;
    --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-xl:20px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 2px 8px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 12px 32px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.05);
    --shadow-hover:0 8px 20px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.06);
    --ease:cubic-bezier(.22,.85,.35,1); --ease-spring:cubic-bezier(.34,1.4,.64,1);
    --t-fast:.15s; --t:.22s; --t-slow:.35s;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,var(--brand-soft) 0,var(--bg) 260px);background-attachment:fixed;color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  ::selection{background:var(--brand-soft);color:var(--brand-dark);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#d7dae0;border-radius:20px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:#b9bec7;}

  @keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes popIn{0%{opacity:0;transform:scale(.85);}70%{opacity:1;transform:scale(1.03);}100%{transform:scale(1);}}
  @keyframes logoPop{0%{opacity:0;transform:scale(.6) rotate(-8deg);}60%{opacity:1;transform:scale(1.08) rotate(2deg);}100%{transform:scale(1) rotate(0);}}
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}

  header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:var(--brand-ink);padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 4px 18px rgba(168,23,50,.22);
    position:relative;z-index:5;}
  header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.1px;}
  header .sub{font-size:12px;opacity:.85;margin-top:2px;}
  header img{transition:transform var(--t) var(--ease-spring);animation:logoPop .5s var(--ease-spring);}
  header img:hover{transform:scale(1.07) rotate(-3deg);}
  .role-switch{display:flex;gap:6px;flex-wrap:wrap;}
  .role-switch button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.10);color:#fff;padding:7px 13px;border-radius:20px;
    cursor:pointer;font-size:13px;transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);}
  .role-switch button.active{background:#fff;color:var(--brand);font-weight:600;border-color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.14);animation:popIn .3s var(--ease-spring);}
  .role-switch button:hover:not(.active){background:rgba(255,255,255,.25);transform:translateY(-1px);}
  .role-switch button:active{transform:translateY(0) scale(.96);}
  main{max-width:1200px;margin:0 auto;padding:20px 24px 60px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:18px;
    box-shadow:var(--shadow);animation:fadeSlideUp var(--t-slow) var(--ease) both;transition:box-shadow var(--t) var(--ease);}
  .card h2{margin:0 0 4px;font-size:16px;}
  .card .desc{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tabs button{background:none;border:none;padding:10px 14px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;
    transition:color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);}
  .tabs button.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}
  .tabs button:hover:not(.active){color:var(--ink);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);}
  th{background:#f9fafb;color:#374151;font-weight:600;white-space:nowrap;}
  tr td{transition:background var(--t-fast) var(--ease);}
  tr:hover td{background:var(--brand-soft);}
  .grid-week{overflow-x:auto;}
  .grid-week table{min-width:960px;table-layout:fixed;}
  .grid-week th{vertical-align:top;}
  .grid-week th .dow{display:block;}
  .grid-week th .ddate{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:1px;}
  .grid-week td.cell{vertical-align:top;padding:5px;}
  .slot-box{position:relative;background:#fff;border-radius:var(--radius-sm);padding:9px 10px 9px 13px;font-size:11.5px;line-height:1.45;min-height:96px;cursor:pointer;
    border:1px solid var(--line); border-left:4px solid var(--line); box-shadow:var(--shadow-sm);
    transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);}
  .slot-box.open{border-left-color:var(--ok);background:linear-gradient(180deg,#fbfffc,#fff 40%);}
  .slot-box.near-full{border-left-color:var(--warn);background:linear-gradient(180deg,#fffdf8,#fff 40%);}
  .slot-box.full{border-left-color:var(--full);background:#fff7f7;}
  .slot-box.locked-manual{border-left-color:#6b7280;background:#fafafa;}
  .slot-box.deadline-closed{border-left-color:#9ca3af;background:#fbfbfc;}
  .slot-box.deadline-closed .count{color:#6b7280;}
  .slot-box:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}
  .slot-box:active{transform:translateY(-1px) scale(.99);}
  .slot-box .subj{font-weight:700;color:#111827;margin-bottom:3px;}
  .slot-box .code{color:#4b5563;margin-bottom:4px;}
  .slot-box .meta{color:#374151;}
  .slot-box .meta b{color:#111827;font-weight:600;}
  .slot-box .count{font-size:11px;margin-top:4px;font-weight:600;}
  .slot-box.open .count{color:var(--ok);}
  .slot-box.near-full .count{color:var(--warn);}
  .slot-box.full .count{color:var(--full);}
  .slot-box.locked-manual .count{color:#4b5563;}
  .empty-cell{border-radius:var(--radius-sm);min-height:96px;display:flex;align-items:center;justify-content:center;color:#c1c7d0;font-size:11.5px;
    background:repeating-linear-gradient(45deg,#fbfbfc,#fbfbfc 8px,#f5f6f8 8px,#f5f6f8 16px);border:1px dashed #e5e7eb;
    cursor:pointer;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease);}
  .empty-cell:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;transition:transform var(--t-fast) var(--ease);}
  .badge.open{background:var(--ok-bg);color:var(--ok);}
  .badge.full{background:var(--full-bg);color:var(--full);}
  .badge.locked{background:var(--locked-bg);color:#374151;}
  .btn{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border:none;padding:9px 16px;border-radius:var(--radius-sm);
    font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 1px 2px rgba(168,23,50,.15);
    transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),background var(--t-fast) var(--ease),filter var(--t-fast) var(--ease);}
  .btn:hover{filter:brightness(1.06);box-shadow:0 4px 12px rgba(168,23,50,.28);transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow-sm);}
  .btn.secondary:hover{border-color:#c7cad1;background:#fafbfc;box-shadow:var(--shadow-sm);filter:none;}
  .btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 1px 2px rgba(220,38,38,.18);}
  .btn.danger:hover{box-shadow:0 4px 12px rgba(220,38,38,.3);}
  .btn:disabled{background:#d1d5db;cursor:not-allowed;color:#6b7280;box-shadow:none;transform:none;filter:none;}
  .form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .form-row input, .form-row select, .form-row textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;flex:1;min-width:160px;font-family:inherit;
    transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);}
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field{flex:1;min-width:160px;}
  .field textarea{width:100%;resize:vertical;}
  .eq-tag{display:inline-flex;align-items:center;gap:4px;background:#eef2ff;color:#3730a3;border-radius:12px;padding:2px 6px 2px 9px;margin:2px 4px 2px 0;font-size:11px;white-space:nowrap;
    animation:scaleIn var(--t) var(--ease-spring) both;}
  .eq-tag button{border:none;background:none;color:#4338ca;cursor:pointer;font-size:12px;line-height:1;padding:0 2px;transition:transform var(--t-fast) var(--ease);}
  .eq-tag button:hover{transform:scale(1.25);}
  .eq-tag-ro{display:inline-flex;align-items:center;background:#eef2ff;color:#3730a3;border-radius:12px;padding:2px 9px;margin:2px 4px 2px 0;font-size:11px;white-space:nowrap;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f2430;color:#fff;padding:13px 20px;border-radius:var(--radius);font-size:13px;
    box-shadow:0 10px 28px rgba(0,0,0,.24);opacity:0;transform:translateY(14px) scale(.97);
    transition:opacity var(--t-slow) var(--ease-spring),transform var(--t-slow) var(--ease-spring);pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateY(0) scale(1);}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 17px;min-width:130px;box-shadow:var(--shadow-sm);
    animation:fadeSlideUp var(--t-slow) var(--ease) both;transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease);}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);}
  .stat:nth-child(1){animation-delay:.02s;} .stat:nth-child(2){animation-delay:.07s;}
  .stat:nth-child(3){animation-delay:.12s;} .stat:nth-child(4){animation-delay:.17s;}
  .stat .num{font-size:23px;font-weight:750;color:var(--brand);}
  .stat .lbl{font-size:12px;color:var(--muted);}
  .week-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .week-nav .btn.secondary{padding:6px 10px;font-size:12.5px;}
  .week-nav-label{font-weight:700;font-size:14px;color:#111827;margin:0 6px;white-space:nowrap;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(17,20,28,.44);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:100;animation:fadeIn var(--t) var(--ease) both;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:var(--radius-xl);padding:22px;width:420px;max-width:92vw;max-height:85vh;overflow:auto;
    box-shadow:var(--shadow-lg);animation:scaleIn var(--t-slow) var(--ease-spring) both;}
  .modal.wide{width:760px;max-width:95vw;}
  .modal h3{margin-top:0;}
  .modal .close{float:right;cursor:pointer;color:var(--muted);border:none;background:none;font-size:18px;border-radius:50%;width:30px;height:30px;
    transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);}
  .modal .close:hover{background:var(--locked-bg);color:var(--ink);transform:rotate(90deg);}
  small.hint{color:var(--muted);}
  .auth-wrap{min-height:72vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .auth-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-xl);padding:30px 28px;width:400px;max-width:92vw;
    box-shadow:var(--shadow-lg);animation:scaleIn var(--t-slow) var(--ease-spring) both;}
  .auth-card img{animation:logoPop .55s var(--ease-spring) both;}
  .auth-card h1{font-size:20px;margin:0 0 4px;color:var(--brand);}
  .auth-card .desc{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5;}
  .auth-card .field{margin-bottom:12px;}
  .auth-card .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .auth-card .field input, .auth-card .field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;
    transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);}
  .auth-card .field input:focus, .auth-card .field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .auth-card a{color:var(--brand);text-decoration:none;cursor:pointer;transition:color var(--t-fast) var(--ease);}
  .auth-card a:hover{text-decoration:underline;color:var(--brand-dark);}
  .auth-card .switch-line{text-align:center;margin-top:10px;font-size:13px;color:var(--muted);}
  .auth-card .btn{width:100%;padding:11px 14px;font-size:14px;}
  .demo-accounts{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px;}
  .demo-accounts .btn{padding:5px 10px;font-size:11.5px;}
  .user-badge{font-size:12px;opacity:.95;display:flex;align-items:center;gap:10px;animation:fadeSlideUp var(--t-slow) var(--ease) both;}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:14px;">
    <img src="/assets/logo.png" alt="Đại học Y Hà Nội - Phân hiệu Thanh Hóa" style="width:52px;height:52px;border-radius:50%;background:#fff;flex-shrink:0;">
    <div>
      <h1 id="appTitle">Đăng ký Tự học</h1>
      <div class="sub">Phân hiệu Thanh Hóa · Đại học Y Hà Nội</div>
    </div>
  </div>
  <div id="headerRight"></div>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ============================== DỮ LIỆU MẪU ============================== */
const SLOTS = [
  {id:1, buoi:'Sáng', label:'8:00 - 8:50'},
  {id:2, buoi:'Sáng', label:'9:00 - 9:50'},
  {id:3, buoi:'Sáng', label:'10:00 - 10:50'},
  {id:4, buoi:'Chiều', label:'13:30 - 14:20'},
  {id:5, buoi:'Chiều', label:'14:30 - 15:20'},
  {id:6, buoi:'Chiều', label:'15:30 - 16:20'},
];
const DAYS = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];

// ==== NGÀNH (dự phòng mở rộng ngoài Điều dưỡng) ====
// Mỗi ngành có bộ dữ liệu riêng: tổ/lớp, môn học, lịch học, kho dụng cụ — độc lập hoàn toàn với ngành khác.
// Đổi ngành ở góc trên bên phải sẽ đổi hẳn toàn bộ dữ liệu đang hiển thị cho mọi vai trò.
const NGANH_LIST = ['Điều dưỡng','Phục hồi chức năng','Kỹ thuật xét nghiệm','Chẩn đoán hình ảnh'];
let currentNganh = NGANH_LIST[0];

const TO_LOP_BY_NGANH = {
  'Điều dưỡng': ['Tổ 1 - ĐD45A','Tổ 2 - ĐD45A','Tổ 3 - ĐD45B'],
  'Phục hồi chức năng': ['Tổ 1 - PHCN45A','Tổ 2 - PHCN45A'],
  'Kỹ thuật xét nghiệm': ['Tổ 1 - XN45A','Tổ 2 - XN45A'],
  'Chẩn đoán hình ảnh': ['Tổ 1 - CDHA45A','Tổ 2 - CDHA45A'],
};
const SUBJECTS_BY_NGANH = {
  'Điều dưỡng': ['Kỹ thuật tiêm truyền','Chăm sóc vết thương','Đo dấu hiệu sinh tồn','Sơ cấp cứu cơ bản','Kỹ năng giao tiếp lâm sàng'],
  'Phục hồi chức năng': ['Vận động trị liệu cơ bản','Xoa bóp bấm huyệt','Điện trị liệu','Hướng dẫn dụng cụ trợ giúp di chuyển'],
  'Kỹ thuật xét nghiệm': ['Lấy mẫu máu tĩnh mạch','Nhuộm và soi tiêu bản','Xét nghiệm sinh hóa cơ bản','Xét nghiệm huyết học cơ bản'],
  'Chẩn đoán hình ảnh': ['Kỹ thuật chụp X-quang cơ bản','Tư thế chụp X-quang chi','Vận hành máy siêu âm cơ bản','An toàn bức xạ trong chẩn đoán hình ảnh'],
};
const SUBJECT_CODES_BY_NGANH = {
  'Điều dưỡng': {'Kỹ thuật tiêm truyền':'DD301','Chăm sóc vết thương':'DD302','Đo dấu hiệu sinh tồn':'DD303','Sơ cấp cứu cơ bản':'DD304','Kỹ năng giao tiếp lâm sàng':'DD305'},
  'Phục hồi chức năng': {'Vận động trị liệu cơ bản':'PHCN301','Xoa bóp bấm huyệt':'PHCN302','Điện trị liệu':'PHCN303','Hướng dẫn dụng cụ trợ giúp di chuyển':'PHCN304'},
  'Kỹ thuật xét nghiệm': {'Lấy mẫu máu tĩnh mạch':'XN301','Nhuộm và soi tiêu bản':'XN302','Xét nghiệm sinh hóa cơ bản':'XN303','Xét nghiệm huyết học cơ bản':'XN304'},
  'Chẩn đoán hình ảnh': {'Kỹ thuật chụp X-quang cơ bản':'CDHA301','Tư thế chụp X-quang chi':'CDHA302','Vận hành máy siêu âm cơ bản':'CDHA303','An toàn bức xạ trong chẩn đoán hình ảnh':'CDHA304'},
};
const SUBJECT_TEACHERS_BY_NGANH = {
  'Điều dưỡng': {'Kỹ thuật tiêm truyền':'Nguyễn Thị Hạnh','Chăm sóc vết thương':'Trần Minh Tuấn','Đo dấu hiệu sinh tồn':'Lê Thị Thu','Sơ cấp cứu cơ bản':'Phạm Văn Nam','Kỹ năng giao tiếp lâm sàng':'Hoàng Thị Yến'},
  'Phục hồi chức năng': {'Vận động trị liệu cơ bản':'Đỗ Văn Hùng','Xoa bóp bấm huyệt':'Bùi Thị Nga','Điện trị liệu':'Vũ Đình Long','Hướng dẫn dụng cụ trợ giúp di chuyển':'Ngô Thị Hiền'},
  'Kỹ thuật xét nghiệm': {'Lấy mẫu máu tĩnh mạch':'Trịnh Văn Sơn','Nhuộm và soi tiêu bản':'Đặng Thị Linh','Xét nghiệm sinh hóa cơ bản':'Lý Văn Khoa','Xét nghiệm huyết học cơ bản':'Phan Thị Duyên'},
  'Chẩn đoán hình ảnh': {'Kỹ thuật chụp X-quang cơ bản':'Hồ Văn Tâm','Tư thế chụp X-quang chi':'Dương Thị Kiều','Vận hành máy siêu âm cơ bản':'Mai Văn Đạt','An toàn bức xạ trong chẩn đoán hình ảnh':'Chu Thị Oanh'},

// Ngày cụ thể của Thứ 2 - Thứ 6 trong tuần hiện tại (để hiển thị dưới tên Thứ, giống bảng tham chiếu)
function getMonday(base){
  const d = new Date(base);
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0 ? -6 : 1);
  return new Date(d.getFullYear(), d.getMonth(), diff);
}
function fmtDate(d){
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function isoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDateFromISO(iso){
  if(!iso) return '';
  const [y,m,dd] = iso.split('-');
  return `${dd}/${m}/${y}`;
}
function dowLabelFromISO(iso){
  const d = new Date(iso+'T00:00:00');
  const dow = d.getDay(); // 0=CN..6=T7
  const idx = dow===0 ? 6 : dow-1; // 0=Thứ2..6=CN
  return DAYS[idx] || '';
}
const MONDAY = getMonday(new Date());
// Trả về 5 ngày (Thứ 2 - Thứ 6) của tuần cách tuần hiện tại `offset` tuần (0 = tuần này, 1 = tuần sau, -1 = tuần trước...)
function getWeekDates(offset){
  return DAYS.map((_,i)=> new Date(MONDAY.getFullYear(), MONDAY.getMonth(), MONDAY.getDate() + offset*7 + i));
}

/* ============================== KẾT NỐI BACKEND (API thật) ==============================
   authToken lưu ở localStorage để giữ đăng nhập qua lần tải lại trang. Mọi request kèm theo
   header Authorization: Bearer <token>; server tự kiểm tra quyền theo vai trò + ngành, không
   tin tưởng riêng dữ liệu phía client. */
let authToken = localStorage.getItem('tuhoc_token') || null;
let adminAccountsCache = []; // chỉ nạp khi vào màn "Quản lý tài khoản"
let auditLogCache = [];      // chỉ nạp khi vào màn "Lịch sử truy vết"
let auditLogTotal = 0;
let auditLogActionsMap = {}; // mã hành động -> nhãn tiếng Việt (server trả về, dùng chung cho bộ lọc + hiển thị)
let auditLogFilter = { action: '', q: '' };
const AUDIT_LOG_PAGE_SIZE = 50;

async function apiFetch(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch('/api'+path, Object.assign({}, opts, {headers}));
  let body = null;
  try{ body = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok){
    const err = new Error((body && body.error) || `Lỗi máy chủ (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return body;
}
function setAuthToken(t){
  authToken = t;
  if(t) localStorage.setItem('tuhoc_token', t); else localStorage.removeItem('tuhoc_token');
}
// Nạp toàn bộ dữ liệu (lịch, dụng cụ, giao dụng cụ, sinh viên) của 1 ngành từ API, đổ vào đúng các biến
// toàn cục schedule[]/equipment[]/equipmentAssignments[]/students mà phần render đang dùng.
async function loadNganhData(tenNganh){
  const data = await apiFetch('/bootstrap?nganh='+encodeURIComponent(tenNganh));
  schedule[tenNganh] = data.schedule;
  equipment[tenNganh] = data.equipment;
  equipmentAssignments[tenNganh] = data.equipmentAssignments.map(a=>({
    id:a.id, ten:a.ten, slotKey:`${a.dateISO}_${a.slotId}`,
    slot:`${dowLabelFromISO(a.dateISO)} ${fmtDateFromISO(a.dateISO)} · ${(SLOTS.find(s=>s.id===a.slotId)||{}).label||''} · ${a.subject}`,
    ma_sv:a.ma_sv, ten_sv:a.ten_sv, to_lop:a.to_lop, soLuong:a.soLuong, ngayGiao:a.ngayGiao,
  }));
  students = students.filter(s=>s.nganh!==tenNganh).concat(data.students.map(s=>({...s, nganh:tenNganh})));
}
async function loadAdminAccounts(){
  const data = await apiFetch('/admin/accounts');
  adminAccountsCache = data.accounts;
}
// reset=true: bắt đầu lại từ đầu (đổi bộ lọc / mới vào màn); reset=false: nạp thêm trang tiếp theo, nối vào cache cũ.
async function loadAuditLog(reset){
  if(reset) auditLogCache = [];
  const params = new URLSearchParams({ limit: AUDIT_LOG_PAGE_SIZE, offset: auditLogCache.length });
  if(auditLogFilter.action) params.set('action', auditLogFilter.action);
  if(auditLogFilter.q) params.set('q', auditLogFilter.q);
  const data = await apiFetch('/admin/audit-log?'+params.toString());
  auditLogCache = auditLogCache.concat(data.logs);
  auditLogTotal = data.total;
  auditLogActionsMap = data.actions;
}

function slotStatus(cls){
  if(!cls) return null;
  const count = cls.registered.length;
  if(cls.lockedManual) return 'locked-manual';
  if(count >= cls.capacity) return 'full';
  if(count >= cls.capacity - 2) return 'near-full';
  return 'open';
}
function statusLabel(status){
  return {open:'Còn chỗ', 'near-full':'Sắp đầy', full:'Đã đầy (khóa)', 'locked-manual':'Đã khóa (thủ công)'}[status] || '';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
function openModal(html, opts={}){
  const modalBody = document.getElementById('modalBody');
  modalBody.innerHTML = html;
  modalBody.classList.toggle('wide', !!opts.wide);
  document.getElementById('modalOverlay').classList.add('show');
}

async function registerStudent(dateISO, slotId, sv){
  const key = `${dateISO}_${slotId}`;
  const cls = curSchedule()[key];
  if(!cls) return toast('Slot không tồn tại');
  try{
    const body = {scheduleEntryId: cls.id};
    if(currentUser.role === 'ADMIN') body.studentId = sv.id;
    await apiFetch('/registrations', {method:'POST', body:JSON.stringify(body)});
  }catch(e){ return toast(e.message); }
  await loadNganhData(currentNganh);
  toast(`Đăng ký thành công: ${sv.ten_sv} — ${dowLabelFromISO(dateISO)} ${fmtDateFromISO(dateISO)} ${SLOTS.find(s=>s.id==slotId).label}`);
  render();
}
// reopenRole: nếu được truyền (gọi từ modal chi tiết slot), mở lại đúng modal đó sau khi dữ liệu đã làm mới —
// tránh tình trạng modal vẫn hiển thị danh sách cũ (chưa gỡ SV vừa hủy) do render() chỉ vẽ lại phần app phía sau modal.
async function cancelStudent(dateISO, slotId, ma_sv, reopenRole){
  const key = `${dateISO}_${slotId}`;
  const cls = curSchedule()[key];
  if(!cls) return;
  const sv = curStudents().find(s=>s.ma_sv===ma_sv);
  if(!sv) return;
  try{
    const qs = new URLSearchParams({scheduleEntryId:cls.id, studentId:sv.id});
    await apiFetch('/registrations?'+qs.toString(), {method:'DELETE'});
  }catch(e){ return toast(e.message); }
  await loadNganhData(currentNganh);
  toast('Đã hủy đăng ký');
  if(reopenRole){ render(); openSlotDetailModal(dateISO, slotId, reopenRole); }
  else render();
}
async function toggleManualLock(dateISO, slotId){
  const cls = curSchedule()[`${dateISO}_${slotId}`];
  if(!cls) return;
  try{
    await apiFetch(`/schedule/${cls.id}/toggle-lock`, {method:'POST'});
  }catch(e){ return toast(e.message); }
  await loadNganhData(currentNganh);
  const newCls = curSchedule()[`${dateISO}_${slotId}`];
  toast(newCls.lockedManual ? 'Đã khóa slot (thủ công)' : 'Đã mở lại slot');
  render();
}

window.prevWeek = function(){
  if(weekOffset <= WEEK_OFFSET_MIN) return;
  weekOffset--; render();
};
window.nextWeek = function(){
  if(weekOffset >= WEEK_OFFSET_MAX) return;
  weekOffset++; render();
};
window.thisWeek = function(){ weekOffset = 0; render(); };
window.jumpWeeks = function(n){
  weekOffset = Math.max(WEEK_OFFSET_MIN, Math.min(WEEK_OFFSET_MAX, weekOffset + n));
  render();
};
function renderWeekNav(){
  const wd = getWeekDates(weekOffset);
  const rangeLabel = `${fmtDate(wd[0])} – ${fmtDate(wd[4])}`;
  const tag = weekOffset===0 ? '<span class="badge open" style="margin-left:8px;">Tuần này</span>'
    : `<span class="badge locked" style="margin-left:8px;">${weekOffset>0?'Tuần +'+weekOffset:'Tuần '+weekOffset}</span>`;
  return `<div class="week-nav">
    <button class="btn secondary" onclick="prevWeek()" ${weekOffset<=WEEK_OFFSET_MIN?'disabled':''}>◀ Tuần trước</button>
    <button class="btn secondary" onclick="jumpWeeks(-4)" title="Lùi 4 tuần">«</button>
    <div class="week-nav-label">${rangeLabel}${tag}</div>
    <button class="btn secondary" onclick="jumpWeeks(4)" title="Tiến 4 tuần">»</button>
    <button class="btn secondary" onclick="nextWeek()" ${weekOffset>=WEEK_OFFSET_MAX?'disabled':''}>Tuần sau ▶</button>
    ${weekOffset!==0 ? '<button class="btn secondary" onclick="thisWeek()">Về tuần này</button>' : ''}
  </div>`;
}

/* ============================== RENDER: LƯỚI TUẦN (Bảng B) ============================== */
function renderWeekGrid(opts={}){
  const {clickable=false, roleForClick=null} = opts;
  const weekDates = getWeekDates(weekOffset);
  let html = renderWeekNav();
  html += `<div class="legend">
    <span><i class="dot" style="background:#16a34a"></i> Còn chỗ</span>
    <span><i class="dot" style="background:#d97706"></i> Sắp đầy (≥8/10)</span>
    <span><i class="dot" style="background:#dc2626"></i> Đã đầy — tự khóa</span>
    <span><i class="dot" style="background:#6b7280"></i> Khóa thủ công</span>
    ${roleForClick==='SINH_VIEN' ? '<span><i class="dot" style="background:#9ca3af"></i> Hết hạn đăng ký (sau 17:00 hôm trước)</span>' : ''}
  </div>`;
  html += '<div class="grid-week"><table><thead><tr><th style="width:120px;">Khung giờ</th>' +
    DAYS.map((d,i)=>`<th><span class="dow">${d}</span><span class="ddate">${fmtDate(weekDates[i])}</span></th>`).join('') +
    '</tr></thead><tbody>';
  SLOTS.forEach(s=>{
    html += `<tr><td style="background:#fffbe8;color:#92400e;"><b>${s.label}</b><br><small class="hint" style="color:#b45309;">${s.buoi}</small></td>`;
    DAYS.forEach((d,di)=>{
      const dateISO = isoDate(weekDates[di]);
      const key = `${dateISO}_${s.id}`;
      const cls = curSchedule()[key];
      const canEdit = clickable && roleForClick==='TRUONG_BO_MON';
      if(!cls){
        if(canEdit){
          html += `<td class="cell"><div class="empty-cell" style="cursor:pointer;" onclick="handleSlotClick('${dateISO}',${s.id},'${roleForClick}')">+ Thiết lập lịch học</div></td>`;
        } else {
          html += `<td class="cell"><div class="empty-cell">Không mở lớp</div></td>`;
        }
      } else {
        const status = slotStatus(cls);
        // Khóa đăng ký từ 17:00 (giờ VN) ngày hôm trước buổi học — chỉ áp dụng cho SINH VIÊN tự đăng ký
        // (Cô trưởng bộ môn/Cố vấn/Quản lý/Admin vẫn xem đúng màu trạng thái thật để quản lý lịch bình thường).
        // currentUser.role!=='ADMIN' để Admin vẫn đăng ký thay được qua chế độ xem thử "Sinh viên" nếu cần.
        const isDeadlineClosed = roleForClick==='SINH_VIEN' && currentUser.role!=='ADMIN' && cls.registrationClosed && status!=='full' && status!=='locked-manual';
        const boxClass = isDeadlineClosed ? 'deadline-closed' : status;
        const clickAttr = clickable ? `onclick="handleSlotClick('${dateISO}',${s.id},'${roleForClick}')"` : '';
        html += `<td class="cell"><div class="slot-box ${boxClass}" ${clickAttr} style="${clickable?'cursor:pointer':''}">
          <div class="subj">${cls.subject}</div>
          <div class="code">${cls.code||''}</div>
          <div class="meta">Phòng: <b>${cls.room}</b></div>
          <div class="meta">GV: <b>${cls.teacher}</b></div>
          <div class="count">${cls.registered.length}/${cls.capacity} SV${status==='full'?' — Đã khóa':(status==='locked-manual'?' — Khóa tay':(isDeadlineClosed?' — Hết hạn đăng ký':''))}</div>
        </div></td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/* ============================== MODAL CHI TIẾT SLOT ============================== */
function openSlotDetailModal(dateISO, slotId, role){
  const cls = curSchedule()[`${dateISO}_${slotId}`];
  const slot = SLOTS.find(s=>s.id==slotId);
  const status = slotStatus(cls);
  const key = `${dateISO}_${slotId}`;
  let rowsHtml = cls.registered.map(sv=>{
    const eqItems = curEquipAssignments().filter(a=>a.slotKey===key && a.ma_sv===sv.ma_sv);
    const eqHtml = eqItems.length
      ? eqItems.map(a=>`<span class="eq-tag-ro">${a.ten} ×${a.soLuong}</span>`).join('')
      : '<span class="hint">Chưa giao</span>';
    return `<tr><td>${sv.ma_sv}</td><td>${sv.ten_sv}</td><td>${sv.to_lop}</td><td>${eqHtml}</td>
    <td>${role==='TRUONG_BO_MON'||role==='QUAN_LY' ? `<button class="btn danger" style="padding:4px 8px;font-size:11px;" onclick="cancelStudent('${dateISO}',${slotId},'${sv.ma_sv}','${role}')">Hủy</button>`:''}</td></tr>`;
  }).join('');
  if(!rowsHtml) rowsHtml = '<tr><td colspan="5" class="empty">Chưa có sinh viên đăng ký</td></tr>';

  let actions = '';
  if(role === 'TRUONG_BO_MON'){
    actions = `<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn ${cls.lockedManual?'secondary':'danger'}" onclick="toggleManualLock('${dateISO}',${slotId});closeModal();">
        ${cls.lockedManual? 'Mở lại slot' : 'Khóa slot (thủ công)'}
      </button>
      <button class="btn secondary" onclick="openScheduleEditor('${dateISO}',${slotId})">Sửa lịch học</button>
    </div>`;
  }

  openModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h3>${dowLabelFromISO(dateISO)} ${fmtDateFromISO(cls.ngayHoc)} · ${slot.label}</h3>
    <p style="margin:0 0 6px;color:var(--muted);font-size:13px;">
      Môn học: <b>${cls.subject}</b>${cls.code?` (${cls.code})`:''} · Phòng: ${cls.room} · GV: ${cls.teacher} ·
      Sĩ số: <b>${cls.registered.length}/${cls.capacity}</b> ·
      Trạng thái: <span class="badge ${status==='open'?'open':(status==='full'?'full':'locked')}">${statusLabel(status)}</span>
    </p>
    ${cls.content ? `<p style="margin:0 0 10px;color:var(--muted);font-size:13px;">Nội dung: ${cls.content}</p>` : ''}
    <table><thead><tr><th>Mã SV</th><th>Tên</th><th>Tổ/Lớp</th><th>Dụng cụ đã giao</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table>
    ${actions}
  `, {wide:true});

window.onSchedNganhChange = function(){
  const n = document.getElementById('schedNganh').value;
  const opts = Array.from(new Set([...(SUBJECTS_BY_NGANH[n]||[]), ...Object.values(schedule[n]||{}).map(c=>c.subject)]));
  document.getElementById('subjectDatalist').innerHTML = opts.map(s=>`<option value="${s}">`).join('');
};
async function saveScheduleEditor(cellDateISO, slotId){
  const origNganh = currentNganh;
  const origKey = `${cellDateISO}_${slotId}`;
  const existing = schedule[origNganh][origKey];
  const isNew = !existing;
  const subject = document.getElementById('schedSubject').value.trim();
  const room = document.getElementById('schedRoom').value.trim();
  if(!subject) return toast('Vui lòng nhập tên môn học');
  if(!room) return toast('Vui lòng nhập phòng');
  const newSlotId = parseInt(document.getElementById('schedSlot').value);
  const targetNganh = document.getElementById('schedNganh').value;
  const content = document.getElementById('schedContent').value.trim();
  const teacher = document.getElementById('schedTeacher').value.trim();

  let jumpToDateISO = null;
  try{
    if(!isNew){
      await apiFetch(`/schedule/${existing.id}`, {method:'PUT', body:JSON.stringify({nganh:targetNganh, slotId:newSlotId, subject, content, room, teacher})});
      toast(targetNganh !== origNganh
        ? `Đã cập nhật lịch học (chuyển sang ngành ${targetNganh})`
        : (newSlotId!==slotId ? 'Đã cập nhật lịch học (đổi sang khung giờ khác)' : 'Đã cập nhật lịch học'));
      if(targetNganh !== origNganh) jumpToDateISO = cellDateISO;
    } else {
      const newDateISO = document.getElementById('schedDate').value || cellDateISO;
      await apiFetch('/schedule', {method:'POST', body:JSON.stringify({nganh:targetNganh, dateISO:newDateISO, slotId:newSlotId, subject, content, room, teacher})});
      toast(targetNganh !== origNganh ? `Đã tạo buổi học mới cho ngành ${targetNganh}` : 'Đã tạo buổi học mới');
      if(targetNganh !== origNganh) jumpToDateISO = newDateISO;
    }
  }catch(e){ return toast(e.message); }

  if(jumpToDateISO){
    await switchToNganh(targetNganh, Math.max(WEEK_OFFSET_MIN, Math.min(WEEK_OFFSET_MAX, weekOffsetForISO(jumpToDateISO))));
  } else {
    await loadNganhData(origNganh);
  }
  closeModal();
  render();
}
// Tính weekOffset (so với tuần hiện tại) của tuần chứa 1 ngày ISO bất kỳ — dùng để tự nhảy tới đúng tuần sau khi tạo lịch hàng loạt
function weekOffsetForISO(iso){
  const targetMonday = getMonday(new Date(iso+'T00:00:00'));
  return Math.round((targetMonday - MONDAY) / (7*24*60*60*1000));
}

window.bulkCreateSchedule = async function(){
  const fromISO = document.getElementById('bulkFrom').value;
  const toISO = document.getElementById('bulkTo').value;
  const slotId = parseInt(document.getElementById('bulkSlot').value);
  const targetNganh = document.getElementById('bulkNganh').value;
  const subject = document.getElementById('bulkSubject').value.trim();
  const room = document.getElementById('bulkRoom').value.trim();
  const content = document.getElementById('bulkContent').value.trim();
  const teacher = document.getElementById('bulkTeacher').value.trim();
  if(!fromISO || !toISO) return toast('Vui lòng chọn Từ ngày và Đến ngày');
  if(fromISO > toISO) return toast('"Từ ngày" phải trước hoặc bằng "Đến ngày"');
  if(!subject) return toast('Vui lòng nhập tên môn học / bài học');
  if(!room) return toast('Vui lòng nhập phòng học');

  let result;
  try{
    result = await apiFetch('/schedule/bulk', {method:'POST', body:JSON.stringify({nganh:targetNganh, fromISO, toISO, slotId, subject, content, room, teacher})});
  }catch(e){ return toast(e.message); }

  if(result.created===0){
    toast(result.skippedExisting>0
      ? `Không tạo được buổi nào — cả ${result.skippedExisting} ngày trong khoảng đã có lịch tại khung giờ này ở ngành ${targetNganh}.`
      : 'Không có ngày nào trong khoảng đã chọn.');
    return;
  }
  await switchToNganh(targetNganh, Math.max(WEEK_OFFSET_MIN, Math.min(WEEK_OFFSET_MAX, weekOffsetForISO(fromISO))));
  closeModal();
  toast(`Đã tạo ${result.created} buổi học cho ngành ${targetNganh}${result.skippedExisting>0?`, bỏ qua ${result.skippedExisting} buổi đã có lịch`:''}.`);
  render();
};
async function deleteScheduleEntry(dateISO, slotId){
  const key = `${dateISO}_${slotId}`;
  const cls = curSchedule()[key];
  if(!cls) return;
  try{
    await apiFetch(`/schedule/${cls.id}`, {method:'DELETE'});
  }catch(e){ return toast(e.message); }
  await loadNganhData(currentNganh);
  toast('Đã xóa buổi học');
  closeModal();
  render();
}

/* ============================== CÁC MÀN HÌNH THEO ROLE ============================== */
function screenStudent(){
  const isAdminPreview = currentUser.role === 'ADMIN';
  if(!currentStudent || currentStudent.nganh !== currentNganh) currentStudent = curStudents()[0] || null;
  if(!currentStudent){
    return `<div class="card"><h2>Đăng ký tự học</h2><div class="empty">Ngành ${currentNganh} chưa có sinh viên nào — hãy thêm sinh viên (đăng ký tài khoản) trước.</div></div>`;
  }
  const studentOptions = curStudents().map(s=>`<option value="${s.ma_sv}" ${s.ma_sv===currentStudent.ma_sv?'selected':''}>${s.ma_sv} — ${s.ten_sv}</option>`).join('');
  const myRegs = [];
  Object.keys(curSchedule()).forEach(key=>{
    const cls = curSchedule()[key];
    if(cls.registered.some(r=>r.ma_sv===currentStudent.ma_sv)){
      const idx = key.lastIndexOf('_');
      const dateISO = key.slice(0,idx), slotId = parseInt(key.slice(idx+1));
      myRegs.push({dateISO, slotId, s:SLOTS.find(x=>x.id===slotId), cls});

// Xử lý khi bấm vào 1 ô slot trên lưới tuần: SV -> đăng ký nhanh; role khác -> mở modal quản trị
function handleSlotClick(dateISO, slotId, role){
  if(role==='SINH_VIEN'){
    const cls = curSchedule()[`${dateISO}_${slotId}`];
    const status = slotStatus(cls);
    const slot = SLOTS.find(s=>s.id==slotId);
    if(status==='full') return toast('Slot đã đầy 10 người — đã tự động khóa');
    if(status==='locked-manual') return toast('Slot đã bị khóa bởi Cô trưởng bộ môn');
    if(cls.registrationClosed && currentUser.role!=='ADMIN') return toast('Đã hết hạn đăng ký — chỉ được đăng ký tới 17:00 ngày hôm trước buổi học.');
    if(cls.registered.some(r=>r.ma_sv===currentStudent.ma_sv)) return toast('Bạn đã đăng ký slot này rồi');
    openModal(`
      <button class="close" onclick="closeModal()">✕</button>
      <h3>Xác nhận đăng ký</h3>
      <p style="font-size:13px;color:var(--muted);">${dowLabelFromISO(dateISO)} ${fmtDateFromISO(dateISO)} · ${slot.label} · ${cls.subject}</p>
      ${cls.content ? `<p style="font-size:13px;color:var(--muted);margin-top:-6px;">Nội dung: ${cls.content}</p>` : ''}
      <div class="form-row">
        <div class="field"><label>Mã SV</label><input value="${currentStudent.ma_sv}" disabled></div>
        <div class="field"><label>Tên SV</label><input value="${currentStudent.ten_sv}" disabled></div>
        <div class="field"><label>Tổ/Lớp</label><input value="${currentStudent.to_lop}" disabled></div>
      </div>
      <button class="btn" onclick="registerStudent('${dateISO}',${slotId},currentStudent);closeModal();">Xác nhận đăng ký</button>
    `);
    return;
  }
  const cls = curSchedule()[`${dateISO}_${slotId}`];
  if(!cls){
    // Ô trống: Quản lý / Cô trưởng bộ môn thiết lập buổi học mới
    openScheduleEditor(dateISO, slotId);
    return;
  }
  openSlotDetailModal(dateISO, slotId, role);
}

function getSlotsWithStudents(){
  const out = [];
  Object.keys(curSchedule()).forEach(key=>{
    const cls = curSchedule()[key];
    if(cls.registered.length>0){
      const idx = key.lastIndexOf('_');
      const dateISO = key.slice(0,idx), slotId = parseInt(key.slice(idx+1));
      out.push({key, dateISO, slotId, cls});
    }
  });
  out.sort((a,b)=> a.dateISO===b.dateISO ? a.slotId-b.slotId : a.dateISO.localeCompare(b.dateISO));
  return out;
}
function slotLabelFor(dateISO, slotId, cls){
  const s = SLOTS.find(x=>x.id==slotId);
  return `${dowLabelFromISO(dateISO)} ${fmtDateFromISO(dateISO)} · ${s.label} · ${cls.subject}`;
}

    body.ma_sv = document.getElementById('newAccMaSv').value.trim().toUpperCase();
    body.to_lop = document.getElementById('newAccToLop').value.trim();
    if(!body.ma_sv || !body.to_lop) return toast('Vui lòng nhập Mã SV và Tổ/Lớp');
  } else if(role !== 'ADMIN'){
    const moiNganh = STAFF_ROLES_CO_MOI_NGANH.includes(role) && document.getElementById('newAccMoiNganh').checked;
    body.nganh = moiNganh ? '' : document.getElementById('newAccNganh').value;
  }
  try{
    await apiFetch('/admin/accounts', {method:'POST', body:JSON.stringify(body)});
  }catch(e){ return toast(e.message); }
  await loadAdminAccounts();
  toast(`Đã cấp tài khoản ${username} (${ROLE_LABELS[role]})`);
  render();
};
window.openEditAccountModal = function(kind, username){
  const a = adminAccountsCache.find(x=>x.username===username && x.kind===kind);
  if(!a) return;
  const showNganh = kind==='student' || a.role!=='ADMIN';
  const canMoiNganh = STAFF_ROLES_CO_MOI_NGANH.includes(a.role);
  const isMoiNganh = canMoiNganh && !a.nganh;
  openModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h3>Sửa tài khoản — ${username}</h3>
    <div class="field" style="margin-bottom:10px;"><label>Họ tên</label><input id="editAccHoTen" value="${a.hoTen}"></div>
    ${showNganh ? `<div class="field" style="margin-bottom:10px;"><label>Ngành</label>
      <select id="editAccNganh" ${isMoiNganh?'disabled':''}>${NGANH_LIST.map(n=>`<option ${n===a.nganh?'selected':''}>${n}</option>`).join('')}</select>
      ${canMoiNganh ? `<label style="display:block;font-weight:400;font-size:12.5px;margin-top:6px;">
        <input type="checkbox" id="editAccMoiNganh" ${isMoiNganh?'checked':''} onchange="document.getElementById('editAccNganh').disabled=this.checked"> Mọi ngành (xem/thao tác được trên tất cả các ngành, giống Quản trị viên)
      </label>` : ''}
    </div>` : ''}
    <div class="field" style="margin-bottom:14px;"><label>Mật khẩu mới <span class="hint">(để trống nếu không đổi)</span></label><input id="editAccPass" placeholder="••••••"></div>
    <button class="btn" onclick="saveEditAccount('${kind}','${username}')">Lưu thay đổi</button>
  `);
};
window.saveEditAccount = async function(kind, username){
  const hoTen = document.getElementById('editAccHoTen').value.trim();
  const nganhEl = document.getElementById('editAccNganh');
  const moiNganhEl = document.getElementById('editAccMoiNganh');
  const pass = document.getElementById('editAccPass').value;
  if(!hoTen) return toast('Vui lòng nhập họ tên');
  if(pass && pass.length < 4) return toast('Mật khẩu mới cần tối thiểu 4 ký tự');
  const body = {hoTen};
  if(nganhEl) body.nganh = (moiNganhEl && moiNganhEl.checked) ? '' : nganhEl.value;
  if(pass) body.password = pass;
  try{
    await apiFetch(`/admin/accounts/${encodeURIComponent(username)}`, {method:'PUT', body:JSON.stringify(body)});
  }catch(e){ return toast(e.message); }
  if(currentUser.username===username){
    currentUser.hoTen = hoTen;
    if(nganhEl) currentUser.nganh = nganhEl.value;
  }
  await loadAdminAccounts();
  toast('Đã lưu thay đổi tài khoản');
  closeModal();
  render();
};
window.toggleAccountActive = async function(kind, username){
  if(currentUser.username === username) return toast('Không thể tự khóa tài khoản đang đăng nhập');
  try{
    await apiFetch(`/admin/accounts/${encodeURIComponent(username)}/toggle-active`, {method:'POST'});
  }catch(e){ return toast(e.message); }
  await loadAdminAccounts();
  toast('Đã cập nhật trạng thái tài khoản');
  render();
};
window.deleteAccount = async function(kind, username){
  if(currentUser.username === username) return toast('Không thể tự xóa tài khoản đang đăng nhập');
  try{
    await apiFetch(`/admin/accounts/${encodeURIComponent(username)}`, {method:'DELETE'});
  }catch(e){ return toast(e.message); }
  await loadAdminAccounts();
  toast('Đã xóa tài khoản');
  render();
};

/* ============================== LỊCH SỬ TRUY VẾT (chỉ Quản trị viên) ============================== */
function fmtDateTime(iso){
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function screenAuditLog(){
  const actionOptions = Object.keys(auditLogActionsMap).map(k=>`<option value="${k}" ${auditLogFilter.action===k?'selected':''}>${auditLogActionsMap[k]}</option>`).join('');
  const rows = auditLogCache.map(l=>`
    <tr>
      <td style="white-space:nowrap;">${fmtDateTime(l.createdAt)}</td>
      <td>${l.username}${l.hoTen?` <span class="hint">(${l.hoTen})</span>`:''}</td>
      <td>${l.maSv || ''}</td>
      <td>${l.role ? (ROLE_LABELS[l.role]||l.role) : ''}</td>
      <td><span class="badge open">${auditLogActionsMap[l.action] || l.action}</span></td>
      <td>${l.moTa}</td>
    </tr>`).join('');
  return `
  <div class="card">
    <h2>Lịch sử truy vết</h2>
    <div class="desc">Nhật ký mọi hành động làm thay đổi dữ liệu trên hệ thống (đăng nhập, tạo/sửa/xóa tài khoản, lịch học, đăng ký, dụng cụ...) — hiển thị ${auditLogCache.length}/${auditLogTotal} bản ghi, mới nhất trước. Cột "Mã SV" giúp phân biệt 2 sinh viên trùng tên.</div>
    <div class="form-row" style="margin-bottom:14px;">
      <div class="field"><label>Loại hành động</label>
        <select id="auditFilterAction" onchange="onAuditFilterChange()">
          <option value="">— Tất cả —</option>
          ${actionOptions}
        </select>
      </div>
      <div class="field"><label>Tìm theo tên đăng nhập / họ tên / mã SV / nội dung</label>
        <input id="auditFilterQ" value="${auditLogFilter.q}" placeholder="vd: admin, DD001, hoặc tên buổi học..." onkeydown="if(event.key==='Enter')onAuditFilterChange()">
      </div>
      <div class="field" style="justify-content:flex-end;display:flex;">
        <button class="btn secondary" style="height:38px;" onclick="onAuditFilterChange()">Lọc</button>
      </div>
    </div>
    <table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Mã SV</th><th>Vai trò</th><th>Hành động</th><th>Chi tiết</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="empty">Chưa có bản ghi nào</td></tr>'}</tbody></table>
    ${auditLogCache.length < auditLogTotal ? `<div style="margin-top:14px;text-align:center;"><button class="btn secondary" onclick="loadMoreAuditLog()">Tải thêm</button></div>` : ''}
  </div>`;
}
window.onAuditFilterChange = async function(){
  auditLogFilter.action = document.getElementById('auditFilterAction').value;
  auditLogFilter.q = document.getElementById('auditFilterQ').value.trim();
  try{ await loadAuditLog(true); }catch(e){ return toast(e.message); }
  render();
};
window.loadMoreAuditLog = async function(){
  try{ await loadAuditLog(false); }catch(e){ return toast(e.message); }
  render();
};

/* ============================== MAIN RENDER ============================== */
function render(){
  document.getElementById('appTitle').textContent = currentUser ? `Đăng ký Tự học — Ngành ${currentNganh}` : 'Đăng ký Tự học';
  renderHeaderRight();
  const app = document.getElementById('app');
  if(!currentUser){
    app.innerHTML = authScreen==='register' ? screenRegister() : screenLogin();
    return;
  }
  if(currentUser.role==='ADMIN' && currentRole==='ADMIN_ACCOUNTS'){ app.innerHTML = screenAdminAccounts(); return; }
  if(currentUser.role==='ADMIN' && currentRole==='AUDIT_LOG'){ app.innerHTML = screenAuditLog(); return; }
  if(currentRole==='SINH_VIEN') app.innerHTML = screenStudent();
  else if(currentRole==='TRUONG_BO_MON') app.innerHTML = screenTruongBoMon();
  else if(currentRole==='CO_VAN') app.innerHTML = screenCoVan();
  else if(currentRole==='QUAN_LY') app.innerHTML = screenQuanLy();
}

// Vẽ lại toàn bộ khối bên phải header: khi CHƯA đăng nhập thì để trống; Quản trị viên có đủ bộ chuyển Ngành +
// Vai trò (được xem/thao tác mọi nơi); các tài khoản khác chỉ hiển thị TĨNH đúng ngành + vai trò đã được cấp
// (không có nút chuyển) — đúng tinh thần "đăng nhập ngành nào chỉ thấy/thao tác đúng ngành, vai trò đó".
// Vai trò được xem TOÀN BỘ các ngành (không chỉ ngành riêng của tài khoản mình): Cô trưởng bộ môn, Cố vấn học
// tập, Quản lý học tập và dĩ nhiên cả Quản trị viên. Chỉ Sinh viên là bị khóa cứng đúng 1 ngành của mình.
// Được xem/thao tác trên MỌI ngành (không chỉ ngành riêng) khi: là Admin, HOẶC tài khoản Cô trưởng bộ môn/
// Cố vấn học tập/Quản lý học tập được Admin cấp riêng quyền "Mọi ngành" lúc tạo/sửa tài khoản (nganh=null).
// Tài khoản không được cấp "Mọi ngành" thì bị khóa cứng đúng 1 ngành đã gán — giống Sinh viên.
function hasAllNganhAccess(u){ return !!u && (u.role === 'ADMIN' || u.nganh === null); }
function renderHeaderRight(){
  const el = document.getElementById('headerRight');
  if(!currentUser){ el.innerHTML = ''; return; }
  const isAdmin = currentUser.role === 'ADMIN';
  const canSwitchNganh = hasAllNganhAccess(currentUser);
  let html = '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">';
  if(canSwitchNganh){
    html += `<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:11px;opacity:.8;">Ngành:</span><div class="role-switch" id="nganhSwitch"></div></div>`;
  } else {
    html += `<div style="font-size:12px;opacity:.9;">Ngành: <b>${currentUser.nganh}</b></div>`;
  }
  if(isAdmin){
    html += `<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:11px;opacity:.8;">Vai trò:</span><div class="role-switch" id="roleSwitch"></div></div>`;
  } else {
    html += `<div style="font-size:12px;opacity:.9;">Vai trò: <b>${ROLE_LABELS[currentUser.role]}</b></div>`;
  }
  html += `<div class="user-badge">👤 ${currentUser.hoTen}${isAdmin?' (Quản trị viên)':''}
      <button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="openChangeNameModal()">Đổi tên</button>
      <button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="openChangePasswordModal()">Đổi mật khẩu</button>
      <button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="doLogout()">Đăng xuất</button>
    </div>`;
  html += '</div>';
  el.innerHTML = html;
  if(canSwitchNganh) renderNganhSwitch();
  if(isAdmin) renderRoleSwitch();
}

// Cho phép BẤT KỲ tài khoản nào đang đăng nhập (sinh viên lẫn cán bộ) tự đổi tên hiển thị (họ tên) của mình.
window.openChangeNameModal = function(){
  openModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h3>Đổi tên hiển thị</h3>
    <div class="field"><label>Họ tên mới</label><input id="cnName" value="${currentUser.hoTen}" onkeydown="if(event.key==='Enter')doChangeName()"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
      <button class="btn secondary" onclick="closeModal()">Hủy</button>
      <button class="btn" onclick="doChangeName()">Lưu tên mới</button>
    </div>
  `);
};
window.doChangeName = async function(){
  const hoTenMoi = document.getElementById('cnName').value.trim();
  if(!hoTenMoi) return toast('Vui lòng nhập họ tên');
  let res;
  try{ res = await apiFetch('/auth/name', {method:'PUT', body:JSON.stringify({hoTen:hoTenMoi})}); }
  catch(e){ return toast(e.message); }
  currentUser.hoTen = res.ho_ten;
  // Tài khoản Sinh viên còn có tên trong bảng students, được nhúng sẵn vào lịch/danh sách đăng ký/giao dụng
  // cụ đang cache ở client — nạp lại dữ liệu ngành hiện tại để mọi nơi hiển thị đồng bộ tên mới ngay lập tức.
  if(currentUser.role === 'SINH_VIEN'){
    try{ await loadNganhData(currentNganh); }catch(e){ /* không chặn báo thành công vì tên đã lưu ở server */ }
    currentStudent = students.find(s=>s.ma_sv===currentUser.ma_sv) || currentStudent;
  }
  closeModal();
  toast('Đã đổi tên thành công');
  render();
};

// Cho phép BẤT KỲ tài khoản nào đang đăng nhập (sinh viên lẫn cán bộ) tự đổi mật khẩu của chính mình.
window.openChangePasswordModal = function(){
  openModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h3>Đổi mật khẩu</h3>
    <div class="field"><label>Mật khẩu hiện tại</label><input id="cpOld" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')document.getElementById('cpNew').focus()"></div>
    <div class="field"><label>Mật khẩu mới</label><input id="cpNew" type="password" placeholder="tối thiểu 4 ký tự" onkeydown="if(event.key==='Enter')document.getElementById('cpNew2').focus()"></div>
    <div class="field"><label>Nhập lại mật khẩu mới</label><input id="cpNew2" type="password" onkeydown="if(event.key==='Enter')doChangePassword()"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
      <button class="btn secondary" onclick="closeModal()">Hủy</button>
      <button class="btn" onclick="doChangePassword()">Lưu mật khẩu mới</button>
    </div>
  `);
};
window.doChangePassword = async function(){
  const matKhauCu = document.getElementById('cpOld').value;
  const matKhauMoi = document.getElementById('cpNew').value;
  const matKhauMoi2 = document.getElementById('cpNew2').value;
  if(!matKhauCu || !matKhauMoi) return toast('Vui lòng nhập đầy đủ mật khẩu hiện tại và mật khẩu mới');
  if(matKhauMoi !== matKhauMoi2) return toast('Mật khẩu mới nhập lại không khớp');
  if(matKhauMoi.length < 4) return toast('Mật khẩu mới cần tối thiểu 4 ký tự');
  try{
    await apiFetch('/auth/password', {method:'PUT', body:JSON.stringify({matKhauCu, matKhauMoi, matKhauMoi2})});
  }catch(e){ return toast(e.message); }
  closeModal();
  toast('Đã đổi mật khẩu thành công');
};

function renderRoleSwitch(){
  const el = document.getElementById('roleSwitch');
  if(!el) return;
  const items = (currentUser && currentUser.role==='ADMIN') ? [...ROLES, {id:'ADMIN_ACCOUNTS', label:'⚙ Quản lý tài khoản'}, {id:'AUDIT_LOG', label:'📜 Lịch sử truy vết'}] : ROLES;
  el.innerHTML = items.map(r=>`<button class="${r.id===currentRole?'active':''}" onclick="setRole('${r.id}')">${r.label}</button>`).join('');
}
window.setRole = async function(id){
  currentRole = id;
  if(id==='SINH_VIEN' && currentUser && currentUser.role==='ADMIN'){
    if(!currentStudent || currentStudent.nganh!==currentNganh) currentStudent = curStudents()[0] || null;
  }
  if(id==='ADMIN_ACCOUNTS'){
    try{ await loadAdminAccounts(); }catch(e){ toast(e.message); }
  }
  if(id==='AUDIT_LOG'){
    try{ await loadAuditLog(true); }catch(e){ toast(e.message); }
  }
  render();
};

// Đổi NGÀNH đang chọn (chỉ Quản trị viên thao tác được) — đổi hẳn bộ dữ liệu (lịch, tổ/lớp, môn học, kho dụng cụ...) đang hiển thị.
function renderNganhSwitch(){
  const el = document.getElementById('nganhSwitch');
  if(!el) return;
  el.innerHTML = NGANH_LIST.map(n=>`<button class="${n===currentNganh?'active':''}" onclick="setNganh('${n}')">${n}</button>`).join('');
}
// Dùng chung cho: bộ chuyển Ngành ở header, và khi Quản trị viên tạo/sửa lịch học sang 1 ngành khác ngành đang xem
// (đảm bảo tiêu đề trang, bộ chuyển Ngành và các state phụ thuộc ngành luôn đồng bộ ở MỌI nơi đổi currentNganh).
// Luôn nạp lại dữ liệu mới nhất của ngành đích từ API trước khi đổi hẳn currentNganh — đảm bảo không bao giờ
// hiển thị dữ liệu cũ/thiếu của 1 ngành chưa từng xem trong phiên hiện tại.
async function switchToNganh(n, newWeekOffset){
  try{ await loadNganhData(n); }catch(e){ toast(e.message); }
  currentNganh = n;
  weekOffset = (typeof newWeekOffset === 'number') ? newWeekOffset : 0;
  selectedEquipKey = null;
  currentStudent = curStudents()[0] || null;
}
window.setNganh = async function(n){
  if(n===currentNganh) return;
  await switchToNganh(n, 0);
  render();
};

document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});

/* ============================== KHỞI ĐỘNG: khôi phục phiên đăng nhập (nếu có) rồi vẽ màn hình đầu tiên ============================== */
async function init(){
  if(authToken){
    try{
      const me = await apiFetch('/auth/me');
      const acc = userFromApi(me.user);
      currentUser = acc;
      const hasAllNganh = acc.role === 'ADMIN' || acc.nganh === null;
      const targetNganh = hasAllNganh ? NGANH_LIST[0] : acc.nganh;
      await loadNganhData(targetNganh);
      currentNganh = targetNganh;
      if(acc.role === 'ADMIN'){
        currentRole = 'TRUONG_BO_MON';
        currentStudent = curStudents()[0] || null;
      } else {
        currentRole = acc.role;
        currentStudent = acc.role === 'SINH_VIEN' ? students.find(s=>s.ma_sv===acc.ma_sv) : (curStudents()[0] || null);
      }
    }catch(e){
      // Token hết hạn/không hợp lệ — quay về màn đăng nhập, không cần báo lỗi gây khó chịu cho người dùng.
      setAuthToken(null);
      currentUser = null;
    }
  }
  render();
}
init();
</script>
