# Cấu hình Nginx reverse-proxy cho VPS — thay YOUR_SUBDOMAIN bằng subdomain thật (vd tuhoc.truong-cua-ban.edu.vn)
# rồi copy file này vào /etc/nginx/sites-available/tuhoc-dk trên VPS. Xem README.deploy.md mục
# "Cách 3 — VPS riêng với Docker Compose" để biết đầy đủ các bước (bao gồm cả lệnh lấy chứng chỉ HTTPS).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
